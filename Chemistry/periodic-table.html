<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a10">
<title>Periodic table | Science</title>
<link rel="stylesheet" href="periodic-table.css"></head><body>
<header><a href="../">Contents</a><h1>Periodic table</h1>
<input id="q" type="search" placeholder="Search name, symbol or number" enterkeyhint="search" autocomplete="off">
<div class="seg" role="group" aria-label="View"><button data-v="table">Table</button><button data-v="grid">Grid</button><button data-v="sphere">Sphere</button><button data-v="helix">Helix</button><button data-v="rings">Rings</button></div>
<button id="rand">Random</button></header>
<nav id="chips" aria-label="Filter by category"></nav>
<div id="count" aria-live="polite"></div>
<div class="wrap"><main id="T"></main></div>
<div id="S" hidden></div>
<aside id="P" hidden role="dialog" aria-labelledby="pn">
<div class="bar"><button id="prev" aria-label="Previous element">&lsaquo;</button><button id="next" aria-label="Next element">&rsaquo;</button><button id="spin" aria-pressed="true">Auto-rotate</button><button id="x" aria-label="Close">&times;</button></div>
<canvas id="cv" aria-label="Bohr model, drag to rotate"></canvas>
<div class="info"><div id="ps"></div><h2 id="pn"></h2><p class="cat" id="pc"></p><p id="pt"></p><dl id="pd"></dl></div>
</aside>
<script src="periodic-table.js" defer></script></body></html>
